# The main tabs with no account: handwriting, languages, Try it, style, the free practice worksheet,
# Saved and the sign-in options. Nothing here needs the network except /api/config (optional).
appId: com.solyapps.scriptly
---
- launchApp
# Works from a fresh install or from where flow 1 stopped.
- extendedWaitUntil:
    visible: "KEEP SCROLLING"
    timeout: 90000
    optional: true
# The story plays as you scroll; keep scrolling until its last page offers "Continue".
- repeat:
    while:
      notVisible: "Continue →"
    times: 40
    commands:
      - swipe:
          start: 50%, 82%
          end: 50%, 18%
          duration: 300
- tapOn:
    text: "Continue →"
    optional: true
# Setup: skip the account, the birthday and the preferences.
- extendedWaitUntil:
    visible: "Make Scriptly yours"
    timeout: 20000
    optional: true
- tapOn:
    text: "Skip for now"
    optional: true
- tapOn:
    text: "Skip"
    optional: true
- tapOn:
    text: "Skip"
    optional: true
- extendedWaitUntil:
    visible: "Handwriting"
    timeout: 30000
    optional: true

# Handwriting tab, with the built-in letters filled in
- tapOn:
    text: "Handwriting"
    optional: true
- extendedWaitUntil:
    visible: "Fill gaps"
    timeout: 30000
- tapOn: "Fill gaps"
- tapOn:
    text: "OK"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 06-handwriting

# Languages drop-down
- tapOn: "Languages"
- waitForAnimationToEnd
- tapOn:
    text: ".*Hebrew.*"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 07-languages
- tapOn: "Characters"

# More > Try it: type a sentence and see it in the handwriting
- tapOn: "More"
- tapOn: "Try it"
- extendedWaitUntil:
    visible: "Type in English or Hebrew…"
    timeout: 20000
- tapOn: "Type in English or Hebrew…"
- inputText: "Dear Grandma, thank you for the lovely card!"
- hideKeyboard
- waitForAnimationToEnd
- takeScreenshot: 08-try-it
- tapOn: "Save page"
- tapOn:
    text: "OK"
    optional: true

# Style presets and sliders sit lower on the same page
- scrollUntilVisible:
    element: "Quick notes"
    direction: DOWN
- tapOn: "Cursive"
- waitForAnimationToEnd
- takeScreenshot: 09-style

# Back to the tabs (swipe from the left edge)
- swipe:
    start: 1%, 50%
    end: 85%, 50%
    duration: 300
- extendedWaitUntil:
    visible: "Fill gaps"
    timeout: 15000

# Worksheets: the free practice page, answered in handwriting
- tapOn: "Worksheets"
- extendedWaitUntil:
    visible: "Try the practice page"
    timeout: 30000
- takeScreenshot: 10-worksheets
- tapOn: "Try the practice page"
- extendedWaitUntil:
    notVisible: "Opening the practice page…"
    timeout: 90000
- waitForAnimationToEnd
- takeScreenshot: 11-practice-page
- scroll
- waitForAnimationToEnd
- takeScreenshot: 12-practice-answers

# Saved
- tapOn: "Saved"
- waitForAnimationToEnd
- takeScreenshot: 13-saved

# Account: the sign-in options
- tapOn: "Account"
- waitForAnimationToEnd
- takeScreenshot: 14-account
- tapOn:
    text: "Use a username and password"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 15-sign-in
