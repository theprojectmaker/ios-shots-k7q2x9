# Takes App Store screenshots of a prebuilt simulator app on a free GitHub Mac.
# The app is downloaded from the APP_URL secret (never printed). Flows live in maestro/.
name: Screenshots

on:
  workflow_dispatch:

jobs:
  shots:
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Download the simulator app
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          [ -n "$APP_URL" ] || { echo "Set the APP_URL secret first"; exit 1; }
          mkdir -p build-sim
          curl -sL "$APP_URL" -o app.tgz
          tar -xzf app.tgz -C build-sim
          APP=$(find build-sim -maxdepth 3 -name "*.app" | head -1)
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "found: $APP"

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Pick simulators
        run: |
          pick() { xcrun simctl list devices available | grep -E "$1" | tail -1 | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}' | head -1; }
          IPHONE=$(pick 'iPhone (17|16|15) Pro Max')
          IPAD=$(pick 'iPad Pro 13-inch')
          echo "IPHONE=$IPHONE" >> "$GITHUB_ENV"
          echo "IPAD=$IPAD" >> "$GITHUB_ENV"
          echo "iPhone=$IPHONE iPad=$IPAD"

      - name: Take the screenshots
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "600000"
        run: |
          shoot() {
            NAME=$1; UDID=$2
            [ -n "$UDID" ] || { echo "no simulator for $NAME"; return 0; }
            xcrun simctl shutdown all || true; pkill -f xctest || true
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
            xcrun simctl install "$UDID" "$APP"
            mkdir -p "shots/$NAME"
            rm -rf "$HOME/.maestro/tests"
            for F in maestro/*.yaml; do
              B=$(basename "$F" .yaml)
              for ATTEMPT in 1 2 3; do
                echo "== $NAME $B attempt $ATTEMPT"
                if maestro --device "$UDID" test "$F" --test-output-dir "$PWD/shots/$NAME/out-$B-$ATTEMPT"; then break; fi
                echo "flow $B failed on attempt $ATTEMPT"
              done
            done
            find "$PWD/shots/$NAME" "$HOME/.maestro/tests" -name "*.png" 2>/dev/null | while read -r f; do cp -n "$f" "shots/$NAME/$(basename "$f")" || true; done
            xcrun simctl io "$UDID" screenshot "shots/$NAME/zz-final-state.png" || true
            xcrun simctl shutdown "$UDID" || true
          }
          shoot iphone "$IPHONE"
          shoot ipad "$IPAD"
          for f in shots/*/*.png; do echo "$f $(sips -g pixelWidth -g pixelHeight "$f" | tr '\n' ' ')"; done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots
          retention-days: 14
